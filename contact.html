<!DOCTYPE html>
<html lang="en">
<head>
     <link rel="icon" type="image/png" href="images/logo.jpeg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - NutriNest</title>

    <link rel="stylesheet" href="css/contact.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<h1 class="contact-heading">Contact Us</h1>

<div class="contact-container">

    <div class="contact-info">

        <h2>Get In Touch</h2>

        <p><i class="fa-solid fa-location-dot"></i> Chennai, Tamil Nadu</p>

        <p><i class="fa-solid fa-phone"></i> +91 9876543210</p>

        <p><i class="fa-solid fa-envelope"></i> nutrinest@gmail.com</p>

        <p><i class="fa-solid fa-clock"></i> Mon - Sat : 9 AM - 8 PM</p>

    </div>

    <form class="contact-form">

        <input type="text" placeholder="Full Name" required>

        <input type="email" placeholder="Email Address" required>

        <input type="tel" placeholder="Mobile Number" required>

        <textarea placeholder="Your Message" rows="6" required></textarea>

        <button type="submit">Send Message</button>

    </form>

</div>

</body>
</html>
