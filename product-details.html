<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="images/logo.jpeg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - NutriNest</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/product-details.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<h1 class="details-heading">Premium Almonds</h1>

<div class="product-details">

    <div class="product-image">
        <img src="images/almond.jpg" alt="Almond">
    </div>

    <div class="product-info">

        <h2>Premium Almonds</h2>

        <p class="price">₹450 / 500g</p>

        <p>
            Fresh, crunchy and premium quality almonds packed with nutrients.
        </p>

        <label>Quantity</label>
        <input type="number" value="1" min="1">

        <br><br>

        <button class="add-cart">Add to Cart</button>
        <button class="buy-now">Buy Now</button>

        <section class="reviews">

    <h2>Customer Reviews</h2>

    <div class="review-card">
        <h4>⭐⭐⭐⭐⭐ - Rahul</h4>
        <p>Excellent quality almonds. Fresh and crunchy.</p>
    </div>

    <div class="review-card">
        <h4>⭐⭐⭐⭐⭐ - Priya</h4>
        <p>Fast delivery and good packaging.</p>
    </div>

    <div class="review-card">
        <h4>⭐⭐⭐⭐☆ - Arun</h4>
        <p>Worth the price. Will order again.</p>
    </div>

</section>

    </div>

</div>

</body>
</html>
