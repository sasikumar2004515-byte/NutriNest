<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Add Address | NutriNest</title>

  <!-- Google Font -->
  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

  <!-- Font Awesome -->

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- CSS -->

  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/navbar.css}">
  <link rel="stylesheet" th:href="@{/css/footer.css}">
  <link rel="stylesheet" th:href="@{/css/variables.css}">
  <link rel="stylesheet" th:href="@{/css/animation.css}">
  <link rel="stylesheet" th:href="@{/css/address.css}">

</head>

<body>

<!-- Navbar -->

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- ===========================
        ADD ADDRESS
=========================== -->

<section class="address-section">

  <div class="edit-profile-container">

    <div class="page-title">

      <h2>Add New Address</h2>

      <p>Save your delivery address</p>

    </div>

    <form th:action="@{/address/save}"
          method="post"
          id="addAddressForm">

      <input type="hidden"
             name="returnTo"
             th:value="${returnTo}">

      <!-- Full Name -->

      <div class="form-group">

        <label>Full Name</label>

        <input type="text"
               name="fullName"
               required>

      </div>

      <!-- Phone -->

      <div class="form-group">

        <label>Phone Number</label>

        <input type="text"
               name="phone"
               maxlength="10"
               required>

      </div>

      <!-- Address 1 -->

      <div class="form-group">

        <label>Address Line 1</label>

        <textarea
                name="addressLine1"
                rows="3"
                required></textarea>

      </div>

      <!-- Address 2 -->

      <div class="form-group">

        <label>Address Line 2</label>

        <textarea
                name="addressLine2"
                rows="2"></textarea>

      </div>

      <!-- Landmark -->

      <div class="form-group">

        <label>Landmark</label>

        <input type="text"
               name="landmark">

      </div>

      <!-- City -->

      <div class="form-group">

        <label>City</label>

        <input type="text"
               name="city"
               required>

      </div>

      <!-- State -->

      <div class="form-group">

        <label>State</label>

        <input type="text"
               name="state"
               required>

      </div>

      <!-- Pincode -->

      <div class="form-group">

        <label>Pincode</label>

        <input type="text"
               name="pincode"
               maxlength="6"
               required>

      </div>

      <!-- Address Type -->

      <div class="form-group">

        <label>Address Type</label>

        <select name="addressType">

          <option value="Home">Home</option>

          <option value="Office">Office</option>

          <option value="Other">Other</option>

        </select>

      </div>

      <!-- Buttons -->

      <div class="button-group">

        <button type="submit"
                class="save-btn">

          <i class="fa-solid fa-floppy-disk"></i>

          Save Address

        </button>

        <a th:href="@{/address}"
           class="cancel-btn">

          Cancel

        </a>

      </div>

    </form>

  </div>

</section>

<!-- Footer -->

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/navbar.js}"></script>
<script>
  document.getElementById("addAddressForm").addEventListener("submit", function () {

      const form = this;
      const returnTo = form.querySelector('input[name="returnTo"]')?.value || "address";

      sessionStorage.setItem(
          "nutrinestAddressReturn",
          returnTo
      );

  });
</script>

</body>

</html>
