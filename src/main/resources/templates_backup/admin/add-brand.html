<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Brand | NutriNest Admin</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f5f7f5;
        color: #24352b;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 250px;
        height: 100vh;
        background: #163d2a;
        padding: 28px 18px;
        z-index: 1000;
        box-shadow: 4px 0 18px rgba(0, 0, 0, 0.08);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px 30px;
        color: #fff;
    }

    .brand-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: #d9b45f;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #163d2a;
        font-size: 19px;
    }

    .brand h2 {
        margin: 0;
        font-size: 21px;
        font-weight: 700;
    }

    .brand span {
        display: block;
        font-size: 11px;
        color: #b8c8bd;
        margin-top: 2px;
    }

    .nav-title {
        color: #91aa9b;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1px;
        padding: 0 13px 10px;
        text-transform: uppercase;
    }

    .sidebar a {
        display: flex;
        align-items: center;
        gap: 13px;
        color: #d9e5dc;
        text-decoration: none;
        padding: 13px 14px;
        border-radius: 10px;
        margin-bottom: 5px;
        font-size: 14px;
        transition: 0.2s ease;
    }

    .sidebar a i {
        width: 18px;
        text-align: center;
    }

    .sidebar a:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
    }

    .sidebar a.active {
        background: #d9b45f;
        color: #163d2a;
        font-weight: 600;
    }

    .sidebar .logout {
        position: absolute;
        bottom: 25px;
        left: 18px;
        right: 18px;
        color: #f0caca;
    }

    .sidebar .logout:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
        margin-left: 250px;
        min-height: 100vh;
        padding: 30px 35px;
    }

    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
    }

    .page-title h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        color: #183b29;
    }

    .page-title p {
        margin: 6px 0 0;
        color: #77877d;
        font-size: 14px;
    }

    .admin-badge {
        display: flex;
        align-items: center;
        gap: 9px;
        background: #fff;
        border: 1px solid #e3e9e4;
        padding: 9px 14px;
        border-radius: 30px;
        font-size: 13px;
        color: #466052;
    }

    .admin-badge i {
        color: #b28b34;
    }

    /* =========================
       FORM CARD
    ========================= */

    .form-card {
        max-width: 900px;
        background: #fff;
        border: 1px solid #e6ebe7;
        border-radius: 18px;
        padding: 30px;
        box-shadow: 0 5px 20px rgba(22, 61, 42, 0.04);
    }

    .form-header {
        margin-bottom: 28px;
        padding-bottom: 18px;
        border-bottom: 1px solid #edf1ee;
    }

    .form-header h3 {
        margin: 0;
        color: #183b29;
        font-size: 19px;
        font-weight: 700;
    }

    .form-header p {
        margin: 6px 0 0;
        color: #819087;
        font-size: 13px;
    }

    .form-label {
        color: #294435;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .form-control,
    .form-control:focus {
        min-height: 46px;
        border-radius: 10px;
        border: 1px solid #dfe6e1;
        box-shadow: none;
        font-size: 14px;
    }

    .form-control:focus {
        border-color: #7da38a;
        box-shadow: 0 0 0 3px rgba(125, 163, 138, 0.12);
    }

    textarea.form-control {
        min-height: 120px;
        resize: vertical;
    }

    .upload-box {
        border: 1.5px dashed #cbd8cf;
        border-radius: 14px;
        padding: 22px;
        background: #fafcfb;
        text-align: center;
        transition: 0.2s ease;
    }

    .upload-box:hover {
        border-color: #7da38a;
        background: #f7faf7;
    }

    .upload-icon {
        width: 50px;
        height: 50px;
        margin: 0 auto 10px;
        border-radius: 14px;
        background: #edf5ef;
        color: #477858;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
    }

    .upload-box input {
        max-width: 100%;
    }

    .upload-note {
        margin-top: 8px;
        color: #89968e;
        font-size: 11px;
    }

    /* =========================
       IMAGE PREVIEW
    ========================= */

    .preview-wrapper {
        display: none;
        margin-top: 18px;
        text-align: center;
    }

    .preview-wrapper.show {
        display: block;
    }

    .preview-image {
        width: 150px;
        height: 150px;
        border-radius: 14px;
        object-fit: contain;
        background: #f8faf8;
        border: 1px solid #e2e9e3;
        padding: 8px;
    }

    .preview-label {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: #7b8981;
    }

    /* =========================
       ACTIVE
    ========================= */

    .active-box {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        background: #f8faf8;
        border: 1px solid #e4ebe5;
        border-radius: 11px;
    }

    .active-box input {
        width: 18px;
        height: 18px;
        accent-color: #163d2a;
    }

    .active-box label {
        margin: 0;
        color: #294435;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }

    /* =========================
       BUTTONS
    ========================= */

    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 30px;
        padding-top: 22px;
        border-top: 1px solid #edf1ee;
    }

    .btn-custom {
        min-height: 44px;
        padding: 0 20px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: 0.2s ease;
        border: none;
    }

    .btn-cancel {
        background: #f2f5f3;
        color: #52645a;
    }

    .btn-cancel:hover {
        background: #e8eeea;
        color: #294435;
    }

    .btn-save {
        background: #163d2a;
        color: #fff;
    }

    .btn-save:hover {
        background: #23583d;
        color: #fff;
        transform: translateY(-1px);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 900px) {

        .sidebar {
            width: 210px;
        }

        .main {
            margin-left: 210px;
            padding: 25px 20px;
        }

    }

    @media (max-width: 700px) {

        .sidebar {
            position: relative;
            width: 100%;
            height: auto;
            padding: 15px;
        }

        .brand {
            padding-bottom: 15px;
        }

        .nav-title {
            display: none;
        }

        .sidebar a {
            display: inline-flex;
            margin-right: 4px;
            margin-bottom: 4px;
            padding: 9px 11px;
        }

        .sidebar .logout {
            position: static;
            margin-top: 8px;
        }

        .main {
            margin-left: 0;
            padding: 20px 14px;
        }

        .topbar {
            align-items: flex-start;
            gap: 12px;
        }

        .page-title h1 {
            font-size: 23px;
        }

        .admin-badge {
            display: none;
        }

        .form-card {
            padding: 20px;
        }

        .form-actions {
            flex-direction: column-reverse;
        }

        .btn-custom {
            width: 100%;
        }

    }

    @media (max-width: 480px) {

        .brand h2 {
            font-size: 18px;
        }

        .sidebar a {
            font-size: 12px;
        }

        .form-card {
            padding: 16px;
            border-radius: 14px;
        }

    }

  </style>
</head>

<body>

<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

  <div class="brand">

    <div class="brand-icon">
      <i class="fa-solid fa-leaf"></i>
    </div>

    <div>
      <h2>NutriNest</h2>
      <span>ADMIN PANEL</span>
    </div>

  </div>

  <div class="nav-title">Management</div>

  <a th:href="@{/admin/dashboard}">
    <i class="fa-solid fa-chart-line"></i>
    Dashboard
  </a>

  <a th:href="@{/admin/categories}">
    <i class="fa-solid fa-layer-group"></i>
    Categories
  </a>

  <a th:href="@{/admin/products}">
    <i class="fa-solid fa-box-open"></i>
    Products
  </a>

  <a th:href="@{/admin/brands}" class="active">
    <i class="fa-solid fa-tags"></i>
    Brands
  </a>

  <a th:href="@{/admin/orders}">
    <i class="fa-solid fa-cart-shopping"></i>
    Orders
  </a>

  <a th:href="@{/admin/customers}">
    <i class="fa-solid fa-users"></i>
    Customers
  </a>

  <a th:href="@{/logout}" class="logout">
    <i class="fa-solid fa-right-from-bracket"></i>
    Logout
  </a>

</aside>


<!-- =========================
     MAIN
========================= -->

<main class="main">

  <div class="topbar">

    <div class="page-title">
      <h1>Add Brand</h1>
      <p>Create a new product brand</p>
    </div>

    <div class="admin-badge">
      <i class="fa-solid fa-user-shield"></i>
      Administrator
    </div>

  </div>


  <div class="form-card">

    <div class="form-header">

      <h3>
        <i class="fa-solid fa-tags me-2"></i>
        Brand Information
      </h3>

      <p>
        Add the basic details and image for your new brand.
      </p>

    </div>


    <form th:action="@{/admin/brands/save}"
          th:object="${brand}"
          method="post"
          enctype="multipart/form-data">


      <!-- BRAND NAME -->

      <div class="mb-4">

        <label class="form-label">
          Brand Name
        </label>

        <input type="text"
               th:field="*{brandName}"
               class="form-control"
               placeholder="Enter brand name"
               required>

      </div>


      <!-- DESCRIPTION -->

      <div class="mb-4">

        <label class="form-label">
          Description
        </label>

        <textarea th:field="*{description}"
                  class="form-control"
                  placeholder="Enter brand description"></textarea>

      </div>


      <!-- IMAGE -->

      <div class="mb-4">

        <label class="form-label">
          Brand Image
        </label>

        <div class="upload-box">

          <div class="upload-icon">
            <i class="fa-solid fa-cloud-arrow-up"></i>
          </div>

          <input type="file"
                 name="imageFile"
                 id="imageFile"
                 class="form-control"
                 accept="image/*">

          <div class="upload-note">
            Recommended: JPG, JPEG, PNG or WEBP
          </div>

        </div>


        <!-- PREVIEW -->

        <div class="preview-wrapper"
             id="previewWrapper">

          <img id="imagePreview"
               class="preview-image"
               alt="Brand Preview">

          <span class="preview-label">
                        Image Preview
                    </span>

        </div>

      </div>


      <!-- ACTIVE -->

      <div class="mb-2">

        <div class="active-box">

          <input type="checkbox"
                 th:field="*{active}"
                 id="active">

          <label for="active">
            Brand is Active
          </label>

        </div>

      </div>


      <!-- ACTIONS -->

      <div class="form-actions">

        <a th:href="@{/admin/brands}"
           class="btn-custom btn-cancel">

          <i class="fa-solid fa-arrow-left"></i>
          Back to Brands

        </a>

        <button type="submit"
                class="btn-custom btn-save">

          <i class="fa-solid fa-check"></i>
          Save Brand

        </button>

      </div>

    </form>

  </div>

</main>


<script>

  /* =========================
     IMAGE PREVIEW
  ========================= */

  const imageFile =
      document.getElementById("imageFile");

  const imagePreview =
      document.getElementById("imagePreview");

  const previewWrapper =
      document.getElementById("previewWrapper");


  if (imageFile) {

      imageFile.addEventListener("change", function () {

          const file = this.files[0];

          if (!file) {

              previewWrapper.classList.remove("show");
              imagePreview.src = "";

              return;
          }


          if (!file.type.startsWith("image/")) {

              alert("Please select a valid image file.");

              this.value = "";

              previewWrapper.classList.remove("show");

              return;
          }


          const reader = new FileReader();

          reader.onload = function (event) {

              imagePreview.src = event.target.result;

              previewWrapper.classList.add("show");

          };

          reader.readAsDataURL(file);

      });

  }

</script>

</body>
</html>
