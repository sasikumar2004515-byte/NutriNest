<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon"
          type="image/jpeg"
          th:href="@{/images/logo.jpeg}">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | NutriNest</title>

    <link rel="stylesheet" th:href="@{/css/forgot-password.css}">
    <link rel="stylesheet" th:href="@{/css/animation.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<section class="forgot-section">

    <div class="forgot-card">

        <div class="logo-area">

            <img th:src="@{/images/logo.jpeg}" alt="NutriNest">

            <h2>Forgot Password?</h2>

            <p>
                Enter your registered email address.
                We'll help you reset your password securely.
            </p>

        </div>


        <form th:action="@{/forgot-password}"
              method="post"
              id="forgotPasswordForm">


            <!-- EMAIL -->

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your Email"
                        autocomplete="email"
                        required>

            </div>


            <!-- NEW PASSWORD -->

            <div class="input-box password-box">

                <i class="fa-solid fa-lock"></i>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter New Password"
                        autocomplete="new-password"
                        required>

                <button type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password">

                    <i class="fa-solid fa-eye"></i>

                </button>

            </div>


            <!-- PASSWORD STRENGTH -->

            <div class="password-strength">

                <div class="strength-bar">

                    <span id="strengthBar"></span>

                </div>

                <div class="strength-info">

                    <span id="strengthText">
                        Password strength
                    </span>

                </div>

            </div>


            <!-- PASSWORD REQUIREMENTS -->

            <div class="password-requirements">

                <p>Password must contain:</p>

                <div class="requirement" id="lengthCheck">
                    <i class="fa-solid fa-circle-xmark"></i>
                    <span>At least 8 characters</span>
                </div>

                <div class="requirement" id="uppercaseCheck">
                    <i class="fa-solid fa-circle-xmark"></i>
                    <span>One uppercase letter</span>
                </div>

                <div class="requirement" id="lowercaseCheck">
                    <i class="fa-solid fa-circle-xmark"></i>
                    <span>One lowercase letter</span>
                </div>

                <div class="requirement" id="numberCheck">
                    <i class="fa-solid fa-circle-xmark"></i>
                    <span>One number</span>
                </div>

                <div class="requirement" id="specialCheck">
                    <i class="fa-solid fa-circle-xmark"></i>
                    <span>One special character</span>
                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="input-box password-box">

                <i class="fa-solid fa-shield-halved"></i>

                <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm Password"
                        autocomplete="new-password"
                        required>

                <button type="button"
                        class="password-toggle"
                        id="confirmPasswordToggle"
                        aria-label="Show password">

                    <i class="fa-solid fa-eye"></i>

                </button>

            </div>


            <!-- MATCH STATUS -->

            <div id="matchMessage"
                 class="match-message">
            </div>


            <!-- SUBMIT -->

            <button
                    type="submit"
                    class="forgot-btn"
                    id="submitBtn"
                    disabled>

                Send Reset Link

            </button>

        </form>


        <div class="divider">

            <span>OR</span>

        </div>


        <div class="bottom-links">

            <a th:href="@{/login}">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Login

            </a>


            <a th:href="@{/register}">

                Create Account

            </a>

        </div>

    </div>

</section>


<script th:src="@{/js/forgot-password.js}"></script>

<script th:src="@{/js/animation.js}"></script>

</body>

</html>
